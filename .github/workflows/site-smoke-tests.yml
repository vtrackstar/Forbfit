name: BFit site smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check pages, inline scripts, JSON and internal links
        run: node scripts/audit-site.mjs
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile page loads
        run: node scripts/browser-smoke.mjs
      - name: Test workout setup, browser saving and downloads
        run: node scripts/core-flows.mjs
      - name: Check public guide, exercise library and inquiry URLs
        run: node scripts/public-links.mjs
      - name: Save screenshots for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bfit-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
